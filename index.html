<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMTL · Limitless 跨越无界</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="game">
      <!-- 顶栏：游戏名称栏 + 新闻栏 -->
      <header class="topbar">
        <div class="game-title">LMTL<small>Limitless 跨越无界</small></div>
        <div class="news-box">
          <div class="news-wrap"><span class="news-text" id="news-text"></span></div>
          <span class="news-time" id="news-time">--:--</span>
        </div>
      </header>

      <div class="body">
        <!-- 标签页栏：侧边竖排导航 -->
        <nav class="sidebar" id="sidebar" aria-label="阶段导航"></nav>

        <section class="main-wrap">
          <!-- 资源栏 -->
          <div class="res-bar-wrap">
            <div class="res-bar" id="resource-bar"></div>
          </div>

          <!-- 主要内容栏 -->
          <main class="main" id="main">
            <section class="stage-card" id="stage-card">
              <div class="stage-top">
                <div class="stage-actions left" id="stage-actions-left"></div>
                <h2 class="stage-title" id="stage-title">源初</h2>
                <div class="stage-actions right" id="stage-actions-right"></div>
              </div>

              <div class="core-display">
                <div class="core-graphic" aria-hidden="true">
                  <span class="ring ring-a"></span>
                  <span class="ring ring-b"></span>
                  <span class="ring ring-c"></span>
                </div>
                <div class="core-value" id="core-value">0</div>
                <div class="core-label" id="core-label">数值</div>
              </div>

              <div class="stage-bottom">
                <p class="stage-desc" id="stage-desc"></p>
                <button class="stage-btn" id="stage-btn" type="button">积蓄数值</button>
                <p class="stage-hint">当前为界面框架，机制待接入。</p>
              </div>
            </section>
          </main>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
