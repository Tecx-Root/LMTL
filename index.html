<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMTL · Limitless 跨越无界</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 兜底样式：外部 styles.css 未加载时仍保持完整布局 */
    :root { --side-w: 200px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #080c10; color: #d8def0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
    #app, .game { height: 100%; }
    .game { display: flex; flex-direction: column; }
    .topbar { height: 60px; flex: 0 0 auto; display: flex; border-bottom: 1px solid #203040; }
    .game-title { width: var(--side-w); flex: 0 0 var(--side-w); padding: 5px 10px; font-size: 24px; font-weight: 700; color: #e8c766; border-right: 1px solid #203040; white-space: nowrap; }
    .game-title small { display: block; font-size: 14px; font-weight: 400; color: #8b94ab; }
    .news-box { position: relative; flex: 1; overflow: hidden; background: #000; }
    .news-wrap { position: absolute; inset: 0; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
    .news-text { display: inline-block; padding-right: 80px; color: #fff; }
    .news-time { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #8b94ab; font: 12px Consolas, monospace; }
    .body { flex: 1; display: flex; min-height: 0; }
    .sidebar { width: var(--side-w); flex: 0 0 var(--side-w); border-right: 1px solid #203040; background: #0c1117; padding: 6px 0; overflow-y: auto; }
    .main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .res-bar { display: flex; height: 90px; border-bottom: 1px solid #203040; }
    .res-cell { flex: 1 1 0; min-width: 0; padding: 6px 12px; border-right: 1px solid #203040; background: #101820; }
    .res-cell.res-l0 { color: #ffffff; } .res-cell.res-l1 { color: #00ffff; }
    .res-cell.res-l2 { color: #ff00ff; } .res-cell.res-l3 { color: #6aa6ff; }
    .res-name { font-size: 15px; } .res-amount { font-size: 20px; font-weight: 700; }
    .res-total, .res-rate { font-size: 14px; color: #8b94ab; }
    .nav-item { display: block; padding: 7px 14px; color: #8b94ab; text-decoration: none; cursor: pointer; }
    .nav-top { color: #d8def0; font-weight: 700; } .nav-top-solo { color: #e8c766; }
    .nav-sep { border-top: 1px solid #203040; margin: 2px 10px 4px; } .nav-sub { padding-left: 28px; }
    .nav-item.active { color: #e8c766; border-right: 3px solid #e8c766; background: #182430; }
    .main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; align-items: center; justify-content: center; background: linear-gradient(90deg, #0b0d10 0%, #d8dce2 16%, #f2f4f7 50%, #d8dce2 84%, #0b0d10 100%); }
    .stage-card { width: min(440px, 100%); min-height: 420px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid #3a3f47; background: linear-gradient(180deg, #272a30 0%, #15171b 100%); }
    .stage-title { margin: 0; color: #fff; font-size: 22px; text-align: center; }
    .stage-desc { margin: 0; color: #8b94ab; font-size: 13px; line-height: 1.6; text-align: center; }
    [hidden] { display: none !important; }
    .story-panel { width: min(680px, 100%); min-height: 420px; padding: 24px; display: flex; flex-direction: column; gap: 18px; border: 1px solid #3a3f47; background: linear-gradient(180deg, #272a30 0%, #15171b 100%); cursor: pointer; }
    .story-head { display: flex; gap: 18px; align-items: center; }
    .story-portrait { width: 120px; height: 120px; flex: 0 0 120px; border: 1px solid #3a3f47; background: #15171b; overflow: hidden; }
    .story-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .story-intro { flex: 1; min-width: 0; }
    .story-intro h2 { margin: 0 0 6px; color: #fff; font-size: 20px; }
    .story-intro p { margin: 0; color: #8b94ab; font-size: 13px; line-height: 1.6; }
    .story-dialogue { flex: 1; min-height: 140px; padding: 18px 20px; border: 1px solid #3a3f47; background: rgba(0,0,0,.32); display: flex; flex-direction: column; gap: 10px; }
    .story-speaker { color: #e8c766; font-size: 15px; font-weight: 700; }
    .is-narration .story-speaker { color: #58d4c9; }
    .story-line { margin: 0; color: #fff; font-size: 18px; line-height: 1.7; }
    .is-narration .story-line { color: #d8def0; font-style: italic; }
    .story-foot { display: flex; align-items: center; justify-content: space-between; }
    .story-progress { color: #8b94ab; font: 12px Consolas, monospace; }
    .story-next { padding: 6px 18px; border: 1px solid #4a5058; background: #2b2e34; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
    <div class="game">
      <!-- 顶栏：游戏名称栏 + 新闻栏 -->
      <header class="topbar">
        <div class="game-title">LMTL<small>Limitless 跨越无界</small></div>
        <div class="news-box">
          <div class="news-wrap"><span class="news-text" id="news-text"></span></div>
          <span class="news-time" id="news-time">--:--</span>
        </div>
      </header>

      <div class="body">
        <!-- 标签页栏：侧边竖排导航 -->
        <nav class="sidebar" id="sidebar" aria-label="阶段导航"></nav>

        <section class="main-wrap">
          <!-- 资源栏 -->
          <div class="res-bar-wrap">
            <div class="res-bar" id="resource-bar"></div>
          </div>

          <!-- 主要内容栏 -->
          <main class="main" id="main">
            <section class="stage-card" id="stage-card">
              <h2 class="stage-title" id="stage-title">源初</h2>
              <p class="stage-desc" id="stage-desc"></p>
            </section>

            <section class="story-panel" id="story-panel" hidden>
              <div class="story-head">
                <div class="story-portrait"><img src="assets/characters/Derterition.png" alt="Derterition"></div>
                <div class="story-intro">
                  <h2>第0章 · 源初</h2>
                  <p>混沌初开，Derterition 在微光中追寻自己的身世。</p>
                </div>
              </div>
              <div class="story-dialogue">
                <div class="story-speaker" id="story-speaker"></div>
                <p class="story-line" id="story-line"></p>
              </div>
              <div class="story-foot">
                <span class="story-progress" id="story-progress"></span>
                <button class="story-next" id="story-next" type="button">继续</button>
              </div>
            </section>
          </main>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
