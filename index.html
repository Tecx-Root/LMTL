<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMTL · Limitless 跨越无界</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 兜底样式：外部 styles.css 未加载时仍保持完整布局 */
    :root {
      --side-w: 200px;
      --c-l0: #ffffff;
      --c-l1: #00ffff;
      --c-l2: #ff00ff;
      --c-l3: #6aa6ff;
      --bg: #080c10;
      --panel: #0c1117;
      --bg2: #101820;
      --bg3: #182430;
      --line: #203040;
      --text: #d8def0;
      --dim: #8b94ab;
      --gold: #e8c766;
      --cyan: #58d4c9;
      --purple: #b18cff;
      --red: #ff7a7a;
      --news-bg: #000000;
      --panel-border: #3a3f47;
      --btn-bg: #2b2e34;
      --story-bg: radial-gradient(ellipse at center, #161a20 0%, #05070a 100%);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    body[data-theme="abyss"] {
      --bg: #050a14; --panel: #0a1220; --bg2: #101c30; --bg3: #182c48;
      --line: #20345a; --text: #d8e6ff; --dim: #8b9ec0; --gold: #6fa8ff;
      --news-bg: #000208; --panel-border: #3a5078; --btn-bg: #253450;
      --story-bg: radial-gradient(ellipse at center, #101a30 0%, #03060e 100%);
    }
    body[data-theme="ember"] {
      --bg: #100808; --panel: #1a0e0e; --bg2: #281414; --bg3: #381e1e;
      --line: #522626; --text: #f0dcdc; --dim: #b08b8b; --gold: #ff8a6f;
      --news-bg: #080000; --panel-border: #6a3838; --btn-bg: #3a2222;
      --story-bg: radial-gradient(ellipse at center, #2a1414 0%, #0e0404 100%);
    }
    body[data-theme="mono"] {
      --bg: #0b0b0b; --panel: #131313; --bg2: #1c1c1c; --bg3: #282828;
      --line: #383838; --text: #e0e0e0; --dim: #9a9a9a; --gold: #d0d0d0;
      --news-bg: #000000; --panel-border: #4a4a4a; --btn-bg: #2b2b2b;
      --story-bg: radial-gradient(ellipse at center, #1c1c1c 0%, #050505 100%);
    }
    * { box-sizing: border-box; }
    button, .nav-item { -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 16px; }
    [hidden] { display: none !important; }
    #app, .game { height: 100%; }
    .game { display: flex; flex-direction: column; }
    .topbar { height: 60px; flex: 0 0 auto; display: flex; border-bottom: 1px solid var(--line); }
    .game-title { width: var(--side-w); flex: 0 0 var(--side-w); padding: 5px 10px; font-size: 24px; font-weight: 700; color: var(--gold); border-right: 1px solid var(--line); white-space: nowrap; }
    .game-title small { display: block; font-size: 14px; font-weight: 400; color: var(--dim); letter-spacing: 0; }
    .news-box { position: relative; flex: 1; overflow: hidden; background: var(--news-bg); }
    .news-wrap { position: absolute; inset: 0; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
    .news-text { display: inline-block; padding-right: 80px; color: #fff; font-size: 16px; }
    .news-time { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font: 12px Consolas, monospace; }
    .body { flex: 1; display: flex; min-height: 0; }
    .sidebar { width: var(--side-w); flex: 0 0 var(--side-w); border-right: 1px solid var(--line); background: var(--panel); padding: 6px 0; overflow-y: auto; }
    .main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .res-bar { display: flex; height: 90px; border-bottom: 1px solid var(--line); }
    .res-cell { flex: 1 1 0; min-width: 0; padding: 6px 12px; border-right: 1px solid var(--line); background: var(--bg2); line-height: 1.25; }
    .res-cell:last-child { border-right: none; }
    .res-cell.res-l0 { color: var(--c-l0); } .res-cell.res-l1 { color: var(--c-l1); }
    .res-cell.res-l2 { color: var(--c-l2); } .res-cell.res-l3 { color: var(--c-l3); }
    .res-name { font-size: 15px; } .res-amount { font-size: 20px; font-weight: 700; }
    .res-total, .res-rate { font-size: 14px; color: var(--dim); }
    .nav-item { display: block; padding: 7px 14px; color: var(--dim); text-decoration: none; cursor: pointer; font-size: 16px; }
    .nav-top { color: var(--text); font-weight: 700; }
    .nav-sep { border-top: 1px solid var(--line); margin: 2px 10px 4px; }
    .nav-sub { padding-left: 28px; }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { color: var(--gold); border-right: 3px solid var(--gold); background: var(--bg3); }
    .main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; align-items: center; justify-content: center; background: var(--panel); }
    .stage-card { width: min(760px, 100%); margin: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .stage-title { margin: 0; color: var(--text); font-size: 22px; text-align: center; }
    .stage-desc { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.6; text-align: center; }
    .value-core-wrap { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .value-core { position: relative; width: 190px; height: 190px; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle at 50% 40%, var(--bg3), var(--bg2) 70%); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; overflow: visible; }
    .value-core:hover { border-color: var(--cyan); }
    .value-core:active { transform: scale(.97); }
    .value-core-label { font-size: 13px; color: var(--dim); letter-spacing: .12em; }
    .value-amount { font: 700 34px/1 Consolas, monospace; color: var(--gold); font-variant-numeric: tabular-nums; }
    .value-rate { font: 13px Consolas, monospace; color: var(--cyan); }
    .per-click { color: var(--dim); font: 13px Consolas, monospace; }
    .value-float { position: absolute; z-index: 5; pointer-events: none; color: var(--gold); font: 700 18px Consolas, monospace; text-shadow: 0 0 8px rgba(0,0,0,.8); }
    .upgrade-grid { width: min(680px, 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .upgrade-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border: 1px solid var(--panel-border); border-radius: 2px; background: var(--bg2); color: var(--text); text-align: left; cursor: pointer; }
    .upgrade-card:disabled { cursor: not-allowed; opacity: .55; }
    .upgrade-card.affordable { border-color: var(--gold); }
    .upgrade-card.affordable:hover { background: var(--bg3); }
    .upgrade-name { font-size: 15px; font-weight: 700; }
    .upgrade-level { font: 13px Consolas, monospace; color: var(--dim); text-align: right; }
    .upgrade-desc { grid-column: 1 / -1; font-size: 12px; color: var(--dim); }
    .upgrade-cost { grid-column: 1 / -1; font: 13px Consolas, monospace; color: var(--gold); }

    /* 设置面板 */
    .settings-panel { width: min(760px, 100%); margin: auto; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
    .settings-title { margin: 0; color: var(--text); font-size: 22px; letter-spacing: 0.1em; text-align: center; }
    .settings-list { display: flex; flex-direction: column; gap: 22px; }
    .setting-row { display: flex; flex-direction: column; gap: 10px; }
    .setting-label { color: var(--gold); font-size: 14px; font-weight: 700; }
    .setting-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .setting-btn, .setting-option { padding: 7px 16px; border: 1px solid var(--panel-border); border-radius: 2px; background: var(--btn-bg); color: var(--text); font: 13px "Microsoft YaHei", sans-serif; cursor: pointer; }
    .setting-btn:hover, .setting-option:hover { border-color: var(--cyan); }
    .setting-option.active { border-color: var(--gold); color: var(--gold); background: var(--bg3); }
    .setting-hint { margin: 0; color: var(--dim); font-size: 12px; min-height: 16px; }

    /* 统计面板 */
    .stats-panel { width: min(760px, 100%); margin: auto; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
    .stats-title { margin: 0; color: var(--text); font-size: 22px; letter-spacing: 0.1em; text-align: center; }
    .stats-view { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .stats-group { padding: 14px 18px; border: 1px solid var(--panel-border); background: var(--bg2); }
    .stats-group-title { margin: 0 0 8px; color: var(--gold); font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
    .stat-row { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .stat-key { color: var(--dim); } .stat-val { color: var(--text); font-variant-numeric: tabular-nums; }

    /* 剧情：全屏覆盖层 */
    .story-panel { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 60px; background: var(--story-bg); }
    .story-skip { position: absolute; top: 24px; right: 28px; width: 40px; height: 40px; padding: 0; border: 1px solid #4a5058; background: rgba(0,0,0,.4); color: var(--text); font-size: 24px; line-height: 1; cursor: pointer; }
    .story-skip:hover { border-color: var(--red); color: var(--red); }
    .story-stage { width: min(960px, 100%); display: flex; align-items: flex-end; justify-content: center; gap: 28px; }
    .story-portrait { width: 220px; flex: 0 0 220px; border: 1px solid var(--panel-border); background: var(--bg2); overflow: hidden; }
    .story-portrait img { width: 100%; height: auto; display: block; }
    .story-dialogue { flex: 1; min-width: 0; min-height: 200px; padding: 28px 32px; border: 1px solid var(--panel-border); background: rgba(0,0,0,.55); display: flex; flex-direction: column; gap: 14px; }
    .story-speaker { color: var(--gold); font-size: 16px; font-weight: 700; min-height: 20px; }
    .story-line { margin: 0; color: var(--text); font-size: 22px; line-height: 1.7; }
    .is-narration .story-line { color: var(--text); font-style: italic; }
    .story-foot { display: flex; align-items: center; justify-content: center; gap: 32px; }
    .story-progress { color: var(--dim); font: 13px Consolas, monospace; }
    .story-next { padding: 8px 28px; border: 1px solid #4a5058; background: rgba(0,0,0,.4); color: var(--text); font-size: 14px; cursor: pointer; }
    .story-next:hover { border-color: var(--cyan); }
    @media (max-width: 760px) {
      :root { --side-w: 130px; }
      .game-title { font-size: 18px; }
      .game-title small { font-size: 11px; }
      .nav-item { padding: 6px 8px; font-size: 14px; }
      .nav-sub { padding-left: 16px; }
      .res-cell { padding: 5px 6px; }
      .res-name, .res-total, .res-rate { font-size: 12px; }
      .res-amount { font-size: 16px; }
      .value-core { width: 150px; height: 150px; }
      .value-amount { font-size: 26px; }
      .upgrade-grid { grid-template-columns: 1fr; }
      .settings-panel { padding: 20px 16px; gap: 18px; }
      .stats-panel { padding: 20px 16px; }
      .stats-view { grid-template-columns: 1fr; }
      .story-panel { padding: 48px 16px; gap: 24px; }
      .story-stage { flex-direction: column; align-items: center; }
      .story-portrait { width: 150px; flex: 0 0 150px; }
      .story-dialogue { width: 100%; min-height: 150px; padding: 18px 20px; }
      .story-line { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="game">
      <!-- 顶栏：游戏名称栏 + 新闻栏 -->
      <header class="topbar">
        <div class="game-title">LMTL<small>Limitless 跨越无界</small></div>
        <div class="news-box">
          <div class="news-wrap"><span class="news-text" id="news-text"></span></div>
          <span class="news-time" id="news-time">--:--</span>
        </div>
      </header>

      <div class="body">
        <!-- 标签页栏：侧边竖排导航 -->
        <nav class="sidebar" id="sidebar" aria-label="阶段导航"></nav>

        <section class="main-wrap">
          <!-- 资源栏 -->
          <div class="res-bar-wrap">
            <div class="res-bar" id="resource-bar"></div>
          </div>

          <!-- 主要内容栏 -->
          <main class="main" id="main">
            <section class="stage-card" id="stage-card">
              <h2 class="stage-title" id="stage-title">源初</h2>
              <p class="stage-desc" id="stage-desc"></p>
              <div class="value-core-wrap" id="value-core-wrap">
                <button class="value-core" id="value-core" type="button" title="点击凝聚数值">
                  <span class="value-core-label">数值</span>
                  <span class="value-amount" id="value-amount">0</span>
                  <span class="value-rate" id="value-rate">+0/秒</span>
                </button>
                <span class="per-click" id="per-click">+1 / 点击</span>
                <div class="upgrade-grid" id="upgrade-grid"></div>
              </div>
            </section>

            <section class="settings-panel" id="settings-panel" hidden>
              <h2 class="settings-title">设置</h2>
              <div class="settings-list">
                <div class="setting-row">
                  <span class="setting-label">颜色主题</span>
                  <div class="setting-options" id="theme-options"></div>
                </div>
                <div class="setting-row">
                  <span class="setting-label">新闻速度</span>
                  <div class="setting-options" id="speed-options"></div>
                </div>
                <div class="setting-row">
                  <span class="setting-label">存档</span>
                  <div class="setting-options">
                    <button class="setting-btn" id="export-save" type="button">导出存档</button>
                    <button class="setting-btn" id="import-save" type="button">导入存档</button>
                    <input type="file" id="import-file" accept=".lmtl,.json,application/json,text/plain" hidden>
                  </div>
                </div>
                <p class="setting-hint" id="save-hint"></p>
              </div>
            </section>

            <section class="stats-panel" id="stats-panel" hidden>
              <h2 class="stats-title">统计</h2>
              <div class="stats-view" id="stats-view"></div>
            </section>
          </main>
        </section>
      </div>
    </div>

    <!-- 剧情覆盖层：播放时盖住整个游戏画面 -->
    <section class="story-panel" id="story-panel" hidden>
      <button class="story-skip" id="story-skip" type="button" title="跳过剧情">×</button>
      <div class="story-stage">
        <div class="story-portrait" id="story-portrait" hidden><img src="assets/characters/Derterition.png" alt="Derterition"></div>
        <div class="story-dialogue">
          <div class="story-speaker" id="story-speaker"></div>
          <p class="story-line" id="story-line"></p>
        </div>
      </div>
      <div class="story-foot">
        <span class="story-progress" id="story-progress"></span>
        <button class="story-next" id="story-next" type="button">继续</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
